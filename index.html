<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Saathi AI</title>
    <!-- Pi SDK Integration -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-bottom: 10px; font-size: 2.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .btn {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 24px;
            background: #ffc107;
            color: #000;
            border-radius: 25px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background: #e0a800; }
        #status-msg { margin-top: 15px; font-size: 0.9rem; color: #d4edda; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Form Saathi AI</h1>
        <p>Your Intelligent Assistant for Government Form Guidance</p>
        <button class="btn" onclick="startTestPayment()">Pay 1 Test Pi</button>
        <div id="status-msg">Initializing Pi SDK...</div>
    </div>

    <script>
        Pi.init({ version: "2.0", sandbox: true });

        const statusDiv = document.getElementById("status-msg");

        function startTestPayment() {
            statusDiv.innerText = "Preparing payment...";

            const paymentData = {
                amount: 1,
                memo: "Test U2A Payment for Checklist",
                metadata: { type: "checklist_test" },
            };

            const callbacks = {
                onReadyForServerApproval: function(paymentId) {
                    statusDiv.innerText = "Simulating server approval...";
                    // सीधा सैंडबॉक्स पेमेंट कम्पलीट करने के लिए Pi API को सूचित करना
                    fetch('https://api.minepi.com/v2/payments/' + paymentId + '/approve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ developer_secret: "" })
                    }).catch(err => console.log(err));
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    statusDiv.innerText = "Completing transaction...";
                    fetch('https://api.minepi.com/v2/payments/' + paymentId + '/complete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ txid: txid })
                    }).then(() => {
                        statusDiv.innerText = "Success! TxID: " + txid;
                        alert("Test Transaction Successful! TxID: " + txid);
                    }).catch(err => {
                        statusDiv.innerText = "Completed locally! TxID: " + txid;
                        alert("Test Transaction Successful! TxID: " + txid);
                    });
                },
                onCancel: function(paymentId) {
                    statusDiv.innerText = "Payment cancelled.";
                },
                onError: function(error, payment) {
                    statusDiv.innerText = "Error: " + error.message;
                }
            };

            Pi.createPayment(paymentData, callbacks);
        }

        window.onload = function() {
            statusDiv.innerText = "Ready. Click to send Test Pi.";
        };
    </script>
</body>
</html>
